name: Congyugram iOS Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Prepare stable source path
        run: |
          sudo mkdir -p /Users/Shared
          rm -rf /Users/Shared/congyugram-ios
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/congyugram-ios

      - name: Build unsigned IPA
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          SOURCE_DIR=/Users/Shared/congyugram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_congyugram"

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          api_id = os.environ.get("TELEGRAM_API_ID", "").strip()
          api_hash = os.environ.get("TELEGRAM_API_HASH", "").strip()
          if not api_id or not api_hash:
              raise SystemExit("TELEGRAM_API_ID and TELEGRAM_API_HASH repository secrets are required")

          template_path = Path("build-system/congyugram-sideload-configuration.template.json")
          output_path = Path("build-system/congyugram-sideload-configuration.generated.json")
          config = json.loads(template_path.read_text(encoding="utf-8"))
          config["api_id"] = api_id
          config["api_hash"] = api_hash
          output_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BUILD_NUMBER=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/congyugram-sideload-configuration.generated.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --disableExtensions \
            --sideloadBuild

          mkdir -p build/artifacts
          bash build-system/prepare-sideload-ipa.sh \
            bazel-bin/Telegram/Telegram.ipa \
            "$SOURCE_DIR/build/artifacts/Congyugram-sideload.ipa" \
            build-system/branding/CongyugramIcon.png \
            build/sideload-ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Congyugram-Sideload-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/congyugram-ios/build/artifacts/Congyugram-sideload.ipa
          if-no-files-found: error
